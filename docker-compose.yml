version: '3.8'

services:
  midi-model-app:
    build: .
    ports:
      - "7860:7860"
    volumes:
      # Mount directories for persistent data
      - ./outputs:/app/outputs
      - ./sample:/app/sample
      - ./lightning_logs:/app/lightning_logs
      - ./models:/app/models
      # Optional: mount custom model files
      - ./custom_models:/app/custom_models
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN}
      - HUGGINGFACE_TOKEN=${HF_TOKEN}
      - HF_HOME=/app/models
      - TRANSFORMERS_CACHE=/app/models/transformers
    # GPU support - uncomment if you have NVIDIA Docker
    deploy:
      resources:
         reservations:
           devices:
             - driver: nvidia
               count: 1
               capabilities: [gpu]
    restart: unless-stopped

  # ONNX optimized version (CPU/GPU)
  midi-model-onnx:
    build:
      context: .
      dockerfile: Dockerfile.onnx
    ports:
      - "7861:7860"
    volumes:
      - ./outputs:/app/outputs
      - ./models:/app/models
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - HF_TOKEN=${HF_TOKEN}
      - HUGGINGFACE_TOKEN=${HF_TOKEN}
    restart: unless-stopped
    profiles:
      - onnx

  # Training service (optional)
  midi-model-trainer:
    build: .
    volumes:
      - ./data:/app/data
      - ./lightning_logs:/app/lightning_logs
      - ./outputs:/app/outputs
      - ./models:/app/models
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - HF_TOKEN=${HF_TOKEN}
      - HUGGINGFACE_TOKEN=${HF_TOKEN}
    # GPU support for training - uncomment if you have NVIDIA Docker
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    command: ["python", "train.py", "--data", "/app/data", "--batch-size-train", "2"]
    restart: "no"
    profiles:
      - training